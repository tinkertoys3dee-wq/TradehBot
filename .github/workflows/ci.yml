name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Static checks
        run: ruff check --select F,E9 Trade.py tests
      - name: Compile
        run: python -m py_compile Trade.py
      - name: Validate defaults
        run: python Trade.py --validate-config
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
